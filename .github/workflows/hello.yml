name: Backend CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Installera .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Återställ paket
        run: dotnet restore backend/Starter.slnx

      - name: Kontrollera formatering
        run: dotnet format backend/Starter.slnx --verify-no-changes --no-restore

      - name: Bygg
        run: dotnet build backend/Starter.slnx --no-restore

      - name: Kör tester
        run: dotnet test backend/Starter.slnx --no-build